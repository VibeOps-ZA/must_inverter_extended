name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest (no Home Assistant needed)"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Set up Python"
          uses: actions/setup-python@v5.6.0
          with:
            python-version: "3.13"

        - name: "Install pytest"
          run: python3 -m pip install "pytest>=8,<9"

        - name: "Run the tests"
          run: python3 -m pytest -q
